services:
  aimee-robot:
    build:
      context: .
      dockerfile: Dockerfile
    image: aimee-robot:latest
    container_name: aimee-robot
    hostname: aimee-robot
    
    # Run in privileged mode for hardware access (cameras, serial, GPIO)
    privileged: true
    
    # Use host networking for ROS2 multicast/DDS and local services
    network_mode: host
    
    # Restart on failure unless explicitly stopped
    restart: unless-stopped
    
    # Environment variables
    environment:
      - TZ=America/Los_Angeles
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds_shm.xml
      - AIMEE_ROBOT_WS=/workspace
      - LEMONFOX_API_KEY=${LEMONFOX_API_KEY:-}
      - AIMEE_CLOUD_ENDPOINT=${AIMEE_CLOUD_ENDPOINT:-https://aimeecloud.com}
    
    volumes:
      # Workspace source code
      - .:/workspace:rw
      
      # Vosk models
      - ./vosk-models:/home/arduino/vosk-models:rw
      
      # Device access
      - /dev:/dev:rw
      
      # ALSA audio configuration
      - ~/.asoundrc:/root/.asoundrc:ro
      
      # Session persistence
      - ~/.config:/home/arduino/.config:rw
    
    # Optional: limit resources for the 4GB UNO Q
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M
    
    # Health check
    healthcheck:
      test: ["CMD", "bash", "-c", "source /opt/ros/humble/setup.bash && ros2 node list >/dev/null 2>&1 || true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Default: launch core nodes and monitor on startup
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        if [ ! -f /workspace/install/setup.bash ]; then
          echo 'Building AIMEE workspace...' &&
          cd /workspace &&
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release;
        fi &&
        source /workspace/install/setup.bash &&
        ros2 launch aimee_bringup core.launch.py use_monitor:=true
      "
    
    stdin_open: true
    tty: true
