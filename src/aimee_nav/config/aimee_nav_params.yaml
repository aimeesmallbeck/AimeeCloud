# AimeeNav parameters — GENERIC DEFAULTS
#
# ⚠️  IMPORTANT: These are FALLBACK defaults. When launched via
#     robot.launch.py, values are overridden by the per-robot config
#     (src/aimee_bringup/config/robots/<robot_name>.yaml).
#
#     Do NOT put robot-specific calibrations (ticks_per_meter,
#     track_width_multiplier, etc.) in this file. Put them in the
#     robot's YAML config under base_params.
#
# Platform-agnostic integrated navigation.
#   base_interface: "direct"     → Use /cmd_vel + /odom (UGV02, etc.)
#   base_interface: "direct" → Use WaveRoverDriver (Wave Rover direct control)

aimee_nav:
  ros__parameters:
    # ─── LiDAR ───
    lidar_port: "/dev/ttyUSB0"
    lidar_baud: 230400
    lidar_frame_id: "base_laser"
    lidar_angle_offset_deg: 0.0

    # ─── Base Interface ───
    base_interface: "direct"           # "ros" or "direct"
    # Direct-mode params (ignored when base_interface="ros")
    rover_port: "/dev/ttyACM0"
    rover_baud: 115200
    rover_http_ip: ""               # HTTP mode for Wave Rover ESP32
    control_mode: "wheel_speed"     # "wheel_speed" (T=1) or "velocity" (T=13)
    angular_scale: 1.0              # No extra scaling; controller handles mapping
    track_width_multiplier: 2.0     # Skid-steer scrub compensation
    accel_limit_linear: 0.3         # m/s^2  (0 = disabled)
    accel_limit_angular: 0.5        # rad/s^2 (0 = disabled)

    # ─── Platform Geometry ───
    # UGV02  : wheel_separation=0.23, wheel_radius=0.04, max_speed=0.41
    # WaveRover: wheel_separation=0.172, wheel_radius=0.04, max_speed=0.5
    wheel_separation: 0.26
    wheel_radius: 0.04
    max_speed: 0.4
    max_angular: 0.5              # Maps to ~30% motor power ≈ 90°/s (clean in-place turn)

    # ─── Local Grid Map ───
    grid_size_m: 3.0
    grid_resolution_m: 0.10
    global_map_size_m: 50.0
    global_map_resolution_m: 0.10
    obstacle_inflation_m: 0.15
    decay_time_s: 10.0

    # ─── Navigation Behavior ───
    safety_distance_m: 0.35
    goal_tolerance_m: 0.10
    replan_interval_s: 1.0
    min_clearance_m: 0.20
    navigation_mode: "planned"      # "reactive" or "planned"
    enable_exploration: false        # Enable autonomous exploration (set true after verifying node health)
    exploration_speed_scale: 0.4

    # ─── Rate & Controllers ───
    nav_rate_hz: 3.0                 # Lower rate for UNO Q headroom
    publish_decimation: 150           # Viz topics every ~50s @ 3Hz (reduce DDS load)
    lidar_downsample: 6               # 60 points instead of 360 (6° resolution)
    heading_kp: 2.0
    heading_ki: 0.0
    heading_kd: 1.0
    velocity_kp: 1.0
    velocity_ki: 0.0
    velocity_kd: 0.0

    # ─── Safety & Behavior ───
    enable_reactive: true
    enable_planning: true
    min_frontier_size: 5
    emergency_reverse_time_s: 0.5

    # ─── TF Frames ───
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: true
    publish_map_odom_tf: true  # Set to false when external SLAM provides map→odom

    # ─── Encoder & IMU Tuning ───
    ticks_per_meter: 106.0
                                 # Override in robot YAML with calibrated value
    accel_scale: 0.001197        # m/s^2 per LSB (approx 8192 LSB/g)
    gyro_scale: 0.001066         # rad/s per LSB (approx 16.4 LSB/(deg/s))
    voltage_scale: 0.01          # centivolts -> volts

    # ─── Scan Matching / EKF Tuning ───
    # These values are the VARIANCE (sigma^2) passed to the EKF update step.
    # Lower value = higher trust in scan matcher relative to odometry prediction.
    #
    # Tuned 2026-04-26 for UGV02 with LD19 lidar:
    #   - Threshold lowered because ~60 downsampled points makes 30.0 (50% hit rate)
    #     impossible during motion; 15.0 (25% hit rate) is achievable.
    #   - Search window widened to absorb encoder drift between matches.
    #   - Interval shortened to 0.3s so EKF prediction has less time to drift.
    scan_match_pos_variance: 0.05   # meters^2
    scan_match_yaw_variance: 0.03   # radians^2
    scan_match_interval: 0.3        # Run scan matching every 0.3s (~3 Hz)
    scan_match_search_radius_m: 0.4 # Search radius for scan matcher (m)
    scan_match_search_angle_rad: 0.25 # Search angle for scan matcher (rad = ~14°)
    scan_match_score_threshold: 15.0 # Minimum score to accept scan match

    # ─── Map Persistence ───
    map_save_dir: "~/aimee_maps"
    waypoints_file: ""
    localization_mode: false   # Set to true to disable map updates (load a map first)
