# Ron — Example Robot Configuration
#
# THIS IS A TEMPLATE. Copy this file to ron.yaml (untracked) and customize.
#   cp src/aimee_bringup/config/robots/ron.example.yaml src/aimee_bringup/config/robots/ron.yaml
#
# Arduino UNO Q #1 (Full robot: UGV02 base + RoArm-M3 + OBSBOT + LD19)

robot_name: "ron"

hardware:
  base: "ugv02"
  base_params:
    serial_port: "/dev/ttyACM0"
    baud_rate: 115200
    wheel_separation: 0.172      # WaveRover / UGV02 spec
    wheel_radius: 0.04
    max_speed: 1.0               # Actual hardware max at 100% motor power (0.3 m/s cmd ≈ 30% power)
    max_angular: 1.0             # rad/s → full diff power; 0.3 rad/s cmd ≈ 30% power ≈ 90°/s
    accel_limit_linear: 0.3      # m/s² — ~1s ramp to full speed
    accel_limit_angular: 0.5     # rad/s² — ~1s ramp to full turn rate
    track_width_multiplier: 2.0   # Skid-steer scrub compensation (calibrated from 55° actual / 56.6° odom)
    http_ip: ""                   # Use serial for commands + encoder feedback
    control_mode: "wheel_speed"  # T=1 direct L/R control
    angular_scale: 1.0           # No extra scaling; cmd_vel maps directly to wheel power
    ticks_per_meter: 106.0       # Calibrated 2026-04-25: 71cm actual / 37.7cm odom
    base_interface: "ros"        # AimeeNav mode: "ros" (/cmd_vel + /odom) or "direct" (serial)
  arm: "roarm_m3"
  camera: "obsbot"
  lidar: "ld19"
  lidar_params:
    serial_port: "/dev/ttyUSB0"
    baud_rate: 230400
    frame_id: "base_laser"
    height: 0.18

software:
  monitor: true
  voice: true
  voice_pipeline: legacy
  tts: true
  llm: true
  intent: true
  skills: true
  cloud: true
  navigation_mode: "integrated"   # "integrated" (AimeeNav) or "distributed" (Nav2+SLAM)
