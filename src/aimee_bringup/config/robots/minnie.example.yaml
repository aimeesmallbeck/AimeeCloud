# Minnie — Example Robot Configuration
#
# THIS IS A TEMPLATE. Copy this file to minnie.yaml (untracked) and customize.
#   cp src/aimee_bringup/config/robots/minnie.example.yaml src/aimee_bringup/config/robots/minnie.yaml
#
# Arduino UNO Q #2 (Base + Camera, no arm)

robot_name: "minnie"

hardware:
  base: "wave_rover"
  base_params:
    serial_port: "/dev/ttyACM0"
    baud_rate: 115200
    wheel_separation: 0.172
    wheel_radius: 0.04
    max_speed: 0.5
    http_ip: ""                  # Disable HTTP; use serial for encoder feedback
    control_mode: "velocity"     # T=13 velocity commands
    ticks_per_meter: 200.0       # Encoder ticks per meter (~48 CPR, 0.04m radius)
    base_interface: "ros"        # AimeeNav mode: "ros" (/cmd_vel + /odom) or "direct" (serial)
  arm: "none"
  camera: "obsbot"
  lidar: "ld19"
  lidar_params:
    serial_port: "/dev/ttyUSB0"
    baud_rate: 230400
    frame_id: "base_laser"
    height: 0.18

software:
  monitor: true
  voice: true
  voice_pipeline: legacy
  tts: true
  llm: true
  intent: true
  skills: true
  cloud: true
  navigation_mode: "integrated"   # Minnie runs AimeeNav (ROS topic mode via base_controller)
